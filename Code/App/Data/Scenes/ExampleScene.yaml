# Example Scene for ChillCore24
name: ExampleScene

materials:
  - name: PrimaryMaterial
    shader: LitColour
    texture: DefaultBase.png
    baseColor: [1.0, 0.8, 0.2, 1.0]
    tiling: [1.0, 1.0]

  - name: SecondaryMaterial
    shader: LitColour
    texture: TestPattern.png
    baseColor: [1.0, 1.0, 1.0, 1.0]
    tiling: [1.0, 1.0]

  - name: TransparentBlue
    shader: LitColour
    baseColor: [0.3, 0.5, 1.0]
    opacity: 0.5

  # Emissive ladder. Scene-linear units, so 1.0 is display white: the first
  # sits below it, the second and third above. Only the two above white have
  # anything for bloom to find or for the tone curve to roll off — with the
  # tone map switched off they clip flat instead.
  - name: EmissiveDim
    shader: LitColour
    baseColor: [0.0, 0.0, 0.0]
    emissive: [0.5, 0.15, 0.05]

  - name: EmissiveBright
    shader: LitColour
    baseColor: [0.0, 0.0, 0.0]
    emissive: [3.0, 0.9, 0.3]

  - name: EmissiveIntense
    shader: LitColour
    baseColor: [0.0, 0.0, 0.0]
    emissive: [12.0, 3.6, 1.2]

  # Emissive map rather than a flat factor. The map is modulated by the
  # factor, so the black rock between the veins stays dark while the vein
  # cores land well above display white and bloom.
  - name: EmissiveVeins
    shader: LitColour
    baseColor: [0.04, 0.035, 0.03]
    emissiveTexture: EmissiveVeins.png
    emissive: [5.0, 5.0, 5.0]

  # Every PBR slot filled at once. The maps share one noise field, so the
  # veins the emissive lights up are the same ones the normal map cuts as
  # grooves, the occlusion darkens and the roughness polishes smooth.
  # The same rock without the emission: a dead slab rather than a lit one.
  # The roughness factor scales the map down so the surface takes a tighter
  # specular lobe and actually catches the directional light.
  - name: RockSlab
    shader: Pbr
    texture: RockBase.png
    metallicRoughnessTexture: RockMetallicRoughness.png
    normalTexture: RockNormal.png
    occlusionTexture: RockOcclusion.png
    baseColor: [1.0, 1.0, 1.0]
    metallic: 1.0
    roughness: 0.45

  - name: VeinedRock
    shader: Pbr
    texture: RockBase.png
    metallicRoughnessTexture: RockMetallicRoughness.png
    normalTexture: RockNormal.png
    occlusionTexture: RockOcclusion.png
    emissiveTexture: EmissiveVeins.png
    baseColor: [1.0, 1.0, 1.0]
    metallic: 1.0
    roughness: 1.0
    emissive: [4.0, 4.0, 4.0]

objects:
  - name: Ground
    transform:
      position: [0.0, 0.0, 0.0]
      rotation: [-90.0, 0.0, 0.0]
      scale: [5.0, 5.0, 1.0]
    components:
      - type: RenderableQuad
        material: SecondaryMaterial

  - name: AlphaBlendTest
    gltf: Data/Meshes/AlphaBlendModeTest.glb
    transform:
      position: [12.0, 0.0, 0.0]
      rotation: [0.0, -45.0, 0.0]
      scale: [1.0, 1.0, 1.0]

  - name: SampleObjectGroup
    transform:
      position: [-10.0, 2.0, -5.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    children:
      - name: YellowSphere
        transform:
          position: [0.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableSphere
            material: PrimaryMaterial
          - type: RotateRandom
        children:
          - name: Attachment
            transform:
              position: [1.5, 0.0, 0.0]
              rotation: [0.0, 0.0, 0.0]
              scale: [0.5, 0.5, 0.5]
            components:
              - type: RenderableCube
                material: SecondaryMaterial
      - name: TexturedCube
        transform:
          position: [4.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableMesh
            mesh: Data/Meshes/untitled.obj
          - type: RotateRandom
      - name: GltfSample
        gltf: Data/Meshes/DamagedHelmet.glb
        transform:
          position: [8.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
      - name: Quad01
        transform:
          position: [4.0, 2.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableQuad
            material: InWorldQuad
      - name: Quad02
        transform:
          position: [8.0, 2.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableQuad
            material: InWorldQuad
      - name: Sphere01
        transform:
          position: [10.0, 0.0, -5.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableMesh
            mesh: Data/Meshes/Primitives/sphere.obj
            material: Concrete
      - name: Sphere02
        transform:
          position: [12.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableMesh
            mesh: Data/Meshes/Primitives/sphere.obj
            material: DevYellow
      - name: Sphere03
        transform:
          position: [14.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.0, 1.0, 1.0]
        components:
          - type: RenderableMesh
            mesh: Data/Meshes/Primitives/sphere.obj
            material: BlueTestPattern
      - name: TransparentSphere
        transform:
          position: [17.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]
          scale: [1.5, 1.5, 1.5]
        components:
          - type: RenderableSphere
            material: TransparentBlue
  - name: EmissiveSphereDim
    transform:
      position: [-2.2, 0.6, -4.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    components:
      - type: RenderableSphere
        material: EmissiveDim
  - name: EmissiveSphereBright
    transform:
      position: [0.0, 0.6, -4.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    components:
      - type: RenderableSphere
        material: EmissiveBright
  - name: EmissiveSphereIntense
    transform:
      position: [2.2, 0.6, -4.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    components:
      - type: RenderableSphere
        material: EmissiveIntense
  - name: EmissiveSphereVeins
    transform:
      position: [4.4, 0.6, -4.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    components:
      - type: RenderableSphere
        material: EmissiveVeins
      - type: RotateRandom

  # A flat quad rather than a sphere: the shader shades across UVs, and a
  # UV-sphere pinches at the poles and seams at the wrap. The material is
  # built in MaterialManager, so it is only referenced by name here.
  - name: ProceduralVeinsPanel
    transform:
      position: [-2.0, 2.0, -6.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [3.0, 3.0, 1.0]
    components:
      - type: RenderableQuad
        material: ProceduralVeins

  - name: RockSlabAngled
    transform:
      position: [-4.5, 1.5, 0.0]
      rotation: [-20.0, 65.0, 0.0]
      scale: [4.0, 4.0, 1.0]
    components:
      - type: RenderableQuad
        material: RockSlab


  # RenderableMesh rather than RenderableSphere: the sphere component bakes a
  # vertex layout without a tangent, and normal mapping has no frame without
  # one. The OBJ path derives tangents when the material is PBR.  
  - name: PbrSphereAllMaps
    transform:
      position: [6.6, 0.6, -4.0]
      rotation: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    components:
      - type: RenderableMesh
        mesh: Data/Meshes/Primitives/sphere.obj
        material: VeinedRock
      - type: RotateRandom
