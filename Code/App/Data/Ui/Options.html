<div class="root">
    <div class="options-panel">
        <p class="title">Options</p>

        <div class="toggle-row">
            <span class="toggle-label">Fullscreen</span>
            <input type="checkbox" id="fullscreen" class="toggle" data-action="fullscreen" />
        </div>

        <div class="toggle-row">
            <span class="toggle-label">MSAA</span>
            <select id="msaa" class="dropdown" data-action="msaa">
                <option>None</option>
                <option>2x</option>
                <option>4x</option>
                <option>8x</option>
            </select>
        </div>

        <div class="divider"></div>

        <button class="btn-back" data-action="back">Back</button>
    </div>
</div>
