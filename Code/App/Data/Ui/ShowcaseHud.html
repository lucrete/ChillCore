<div class="root">
    <div class="hud-top">
        <button class="hud-pause" id="pauseButton" data-action="pause">||</button>
        <p class="hud-timer" id="timer">00:00</p>
        <p class="hud-tracking" id="trackingXr">Tracking XR</p>
    </div>
    <joystick id="moveStick" class="joystick joystick-left" data-action="move"/>
    <joystick id="lookStick" class="joystick joystick-right" data-action="look"/>
</div>
